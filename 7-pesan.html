
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BeeMate – Pesan</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <style>
    /* RESET */
    * {
      box-sizing: border-box;
    }

    html {
      background: #000000;
    }

    body {
      margin: 0;
      background: #0B0B0B;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HALAMAN UTAMA */
    .pg {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 20px 24px 100px;
      overflow-x: hidden;
      background: #0B0B0B;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .m {
      color: #B8B8B8;
    }

    .pk {
      color: #FFC933;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
    }

    /* HEADER */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
    }

    .logo {
      display: block;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .verified {
      color: #5FD39A;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .av {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #FFC933;
      color: #0B0B0B;
      font-weight: 800;
    }

    .profile-avatar {
      width: 34px;
      height: 34px;
      font-size: 13px;
    }

    /* PENCARIAN */
    .in {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #8C8C8C;
      border-radius: 12px;
      outline: none;
      background: #0B0B0B;
      color: #FFFFFF;
      font: inherit;
      font-size: 14px;
    }

    .in::placeholder {
      color: #B8B8B8;
    }

    .in:focus {
      border-color: #FFC933;
      outline: 2px solid #FFC933;
      outline-offset: 1px;
    }

    .search {
      margin-bottom: 12px;
    }

    /* DAFTAR PERCAKAPAN */
    .cv {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 14px 0;
      border-bottom: 1px solid #2B2B2B;
      transition: background 0.2s;
    }

    .cv:hover {
      background: #151515;
    }

    .contact-avatar {
      width: 48px;
      height: 48px;
      font-size: 17px;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 800;
    }

    .preview {
      margin-top: 4px;
      overflow: hidden;
      color: #B8B8B8;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .unread {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FFC933;
    }

    .empty {
      display: none;
      padding: 28px 8px;
      color: #B8B8B8;
      font-size: 14px;
      text-align: center;
    }

    /* NAVIGASI BAWAH */
    .tab {
      position: fixed;
      z-index: 5;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 420px;
      height: 76px;
      margin: 0 auto;
      padding: 10px 4px 0;
      border-top: 1.5px solid #2B2B2B;
      background: #101010;
    }

    .tab a {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
      color: #B8B8B8;
      font-size: 11px;
      font-weight: 700;
    }

    .tab a.on {
      color: #FFC933;
    }

    .tab a:focus-visible,
    .cv:focus-visible {
      outline: 2px solid #FFC933;
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      .pg {
        padding-right: 16px;
        padding-left: 16px;
      }

      .header-right {
        gap: 6px;
      }

      .verified {
        font-size: 10px;
      }

      .tab a {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="pg">

    <!-- HEADER -->
    <header class="top">

      <a class="brand" href="5-beranda.html">
        <img
          class="logo"
          src="logo.png"
          alt="Logo BeeMate"
        >
        <span>BeeMate</span>
      </a>

      <div class="header-right">
        <span class="verified">✓ Terverifikasi</span>

        <a
          class="av profile-avatar"
          href="9-profil.html"
          aria-label="Buka profil"
        >
          AN
        </a>
      </div>

    </header>

    <!-- JUDUL -->
    <h1>Pesan</h1>

    <!-- PENCARIAN -->
    <input
      class="in search"
      id="searchInput"
      type="search"
      placeholder="Cari percakapan"
      aria-label="Cari percakapan"
      autocomplete="off"
    >

    <!-- DAFTAR CHAT -->
    <section id="chatList" aria-label="Daftar percakapan">

      <a class="cv" href="8-chat.html" data-search="sukma agung boleh gabung kelompok belajarnya">
        <div class="av contact-avatar">SA</div>

        <div class="contact-info">
          <div class="contact-name">Sukma Agung</div>
          <div class="preview">Boleh gabung ga kelompok belajarnya?</div>
        </div>

        <span class="unread" aria-label="Pesan belum dibaca"></span>
      </a>

      <a class="cv" href="#" data-search="marsela olivia besok jam 4 sore ya">
        <div class="av contact-avatar">MO</div>

        <div class="contact-info">
          <div class="contact-name">Marsela Olivia</div>
          <div class="preview">Kamu lagi gabut gak sekarang?</div>
        </div>
      </a>

      <a class="cv" href="#" data-search="dinda s terima kasih sudah menerima">
        <div class="av contact-avatar">MF</div>

        <div class="contact-info">
          <div class="contact-name">Muhammad Fawwaz</div>
          <div class="preview">Gimana nih, aku keknya gak bisa move on deh..</div>
        </div>
      </a>

      <a class="cv" href="#" data-search="bayu t siap nanti saya kabari">
        <div class="av contact-avatar">BT</div>

        <div class="contact-info">
          <div class="contact-name">Bayu T.</div>
          <div class="preview">Siap, nanti saya kabari</div>
        </div>
      </a>

      <p class="empty" id="emptyMessage">
        Percakapan tidak ditemukan.
      </p>

    </section>

    <!-- NAVIGASI BAWAH -->
    <nav class="tab" aria-label="Navigasi utama">

      <a href="5-beranda.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11l9-8 9 8v10H3z"/>
        </svg>
        <span>Beranda</span>
      </a>

      <a href="6-matching.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5" y="4" width="14" height="16" rx="3"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span>Matching</span>
      </a>

      <a href="7-pesan.html" class="on" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16v11H9l-5 4z"/>
        </svg>
        <span>Pesan</span>
      </a>

      <a href="9-profil.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c1-5 15-5 16 0"/>
        </svg>
        <span>Profil</span>
      </a>

    </nav>
  </main>

  <script>
    const searchInput = document.getElementById("searchInput");
    const chatList = document.getElementById("chatList");
    const conversations = chatList.querySelectorAll(".cv");
    const emptyMessage = document.getElementById("emptyMessage");

    searchInput.addEventListener("input", function () {
      const keyword = this.value.trim().toLowerCase();
      let visibleCount = 0;

      conversations.forEach(function (conversation) {
        const searchText = conversation.dataset.search.toLowerCase();
        const matches = searchText.includes(keyword);

        conversation.hidden = !matches;

        if (matches) {
          visibleCount++;
        }
      });

      emptyMessage.style.display =
        visibleCount === 0 ? "block" : "none";
    });
  </script>
</body>
</html>
