
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BeeMate – Chat</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #0B0B0B;
    }

    body {
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* HALAMAN UTAMA */
    .pg {
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: #0B0B0B;
    }

    .m {
      color: #B8B8B8;
    }

    .pk {
      color: #FFC933;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* HEADER CHAT */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1.5px solid #2B2B2B;
      background: #0B0B0B;
    }

    .back {
      flex: none;
      font-size: 26px;
      line-height: 1;
    }

    .av {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #FFC933;
      color: #0B0B0B;
      font-weight: 800;
    }

    .contact-avatar {
      width: 42px;
      height: 42px;
      font-size: 15px;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-size: 15px;
      font-weight: 800;
    }

    .contact-detail {
      margin-top: 3px;
      color: #B8B8B8;
      font-size: 12px;
    }

    .video-link {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      padding: 6px;
      color: #FFC933;
    }

    .video-link:focus-visible,
    .back:focus-visible {
      outline: 2px solid #FFC933;
      outline-offset: 4px;
    }

    /* AREA PESAN */
    .messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 14px;
      padding: 20px 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .bb {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }

    .received {
      align-self: flex-start;
      border-bottom-left-radius: 5px;
      background: #232323;
      color: #FFFFFF;
    }

    .sent {
      align-self: flex-end;
      border-bottom-right-radius: 5px;
      background: #FFC933;
      color: #0B0B0B;
    }

    /* INPUT PESAN */
    .chat-form {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px max(20px, env(safe-area-inset-bottom));
      border-top: 1.5px solid #2B2B2B;
      background: #101010;
    }

    .message-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #8C8C8C;
      border-radius: 12px;
      outline: none;
      background: #0B0B0B;
      color: #FFFFFF;
      font-size: 14px;
    }

    .message-input::placeholder {
      color: #B8B8B8;
    }

    .message-input:focus {
      border-color: #FFC933;
      outline: 2px solid #FFC933;
      outline-offset: 1px;
    }

    .send-button {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: #FFC933;
      color: #0B0B0B;
      font-size: 19px;
      cursor: pointer;
    }

    .send-button:hover {
      opacity: 0.9;
    }

    .send-button:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      .chat-header {
        gap: 9px;
        padding-right: 14px;
        padding-left: 14px;
      }

      .contact-detail {
        font-size: 11px;
      }

      .messages {
        padding-right: 12px;
        padding-left: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="pg">

    <!-- HEADER -->
    <header class="chat-header">

      <a
        href="7-pesan.html"
        class="back"
        aria-label="Kembali ke Pesan"
      >
        ←
      </a>

      <div class="av contact-avatar" aria-hidden="true">
        NA
      </div>

      <div class="contact-info">
        <div class="contact-name">Sukma Agung</div>

        <div class="contact-detail">
          Computer Science · Angkatan 2024
        </div>
      </div>

      <a
        href="10-video-call.html"
        class="video-link"
        aria-label="Video call dengan Sukma Agung"
        title="Video call"
      >
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="2" y="6" width="13" height="12" rx="2.5"/>
          <path d="M15 10.5l6-3.5v10l-6-3.5"/>
        </svg>
      </a>

    </header>

    <!-- DAFTAR PESAN -->
    <section
      class="messages"
      id="messages"
      aria-label="Percakapan"
      aria-live="polite"
    >

      <div class="bb received">
        Halo! Kita sama-sama tertarik di Computer Science ya?
      </div>

      <div class="bb sent">
        Iya nih, lagi cari teman belajar untuk persiapan kompetisi
      </div>

      <div class="bb received">
        Boleh gabung ga kelompok belajarnya?
      </div>

      <div class="bb sent">
        Boleh banget, nanti saya add
      </div>

    </section>

    <!-- FORM KIRIM PESAN -->
    <form class="chat-form" id="chatForm">

      <input
        class="message-input"
        id="messageInput"
        type="text"
        placeholder="Tulis pesan..."
        aria-label="Tulis pesan"
        autocomplete="off"
        maxlength="2000"
        required
      >

      <button
        class="send-button"
        type="submit"
        aria-label="Kirim pesan"
      >
        ➤
      </button>

    </form>

  </main>

  <script>
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    function scrollToLatest() {
      messages.scrollTop = messages.scrollHeight;
    }

    scrollToLatest();

    chatForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message) return;

      const bubble = document.createElement("div");

      bubble.classList.add("bb", "sent");
      bubble.textContent = message;

      messages.appendChild(bubble);

      messageInput.value = "";
      scrollToLatest();
      messageInput.focus();
    });
  </script>
</body>
</html>
