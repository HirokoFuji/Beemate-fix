
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BeeMate – Panggilan Masuk</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================
       RESET & DASAR
    ========================= */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0B0B0B;
    }

    body {
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HALAMAN UTAMA
    ========================= */
    .pg {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;

      background:
        radial-gradient(
          120% 80% at 50% 30%,
          #2A2210 0%,
          #0B0B0B 70%
        );

      color: #FFFFFF;
    }

    .m {
      color: #B8B8B8;
    }

    .pk {
      color: #FFC933;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
    }

    /* =========================
       HEADER
    ========================= */
    .vtop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .logo {
      display: block;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .pill {
      padding: 6px 12px;
      border: 1px solid #3A3A3A;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       AREA PANGGILAN
    ========================= */
    .stage {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 140px;
      height: 140px;
    }

    .av {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #FFC933;
      color: #0B0B0B;
      font-size: 50px;
      font-weight: 800;
    }

    /* Animasi lingkaran panggilan */
    .ring {
      position: absolute;
      inset: 0;
      border: 2px solid #FFC933;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      animation: pulse 2s infinite;
    }

    .ring.r2 {
      animation-delay: 0.8s;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }

      100% {
        transform: scale(2.3);
        opacity: 0;
      }
    }

    .contact-name {
      margin-top: 14px;
    }

    .call-status {
      font-size: 15px;
    }

    .verified {
      color: #5FD39A;
    }

    /* =========================
       TOMBOL PANGGILAN
    ========================= */
    .ctl {
      display: flex;
      justify-content: center;
      gap: 56px;
      padding: 18px 12px 34px;
      border-top: 1.5px solid #2B2B2B;
      background: #101010;
    }

    .cb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 64px;
      color: #B8B8B8;
      font-size: 11px;
      font-weight: 700;
    }

    .cb a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border: 1.5px solid #8C8C8C;
      border-radius: 50%;
      background: #151515;
      color: #FFFFFF;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .cb a:hover {
      transform: scale(1.06);
    }

    .cb a:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 4px;
    }

    .cb .end {
      border-color: #E5384B;
      background: #E5384B;
      color: #FFFFFF;
    }

    .cb .ok {
      border-color: #FFC933;
      background: #FFC933;
      color: #0B0B0B;
    }
    @media (prefers-reduced-motion: reduce) {
      .ring {
        display: none;
        animation: none;
      }

      .cb a {
        transition: none;
      }
    }
    @media (max-height: 500px) {
      .vtop {
        padding-top: 12px;
      }

      .stage {
        gap: 6px;
      }

      .avatar-wrap,
      .av {
        width: 100px;
        height: 100px;
      }

      .av {
        font-size: 36px;
      }

      .contact-name {
        margin-top: 4px;
      }

      .ctl {
        padding-top: 10px;
        padding-bottom: 12px;
      }

      .cb a {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>

<body>
  <main class="pg">
    <header class="vtop">
      <div class="brand">
        <img
          src="logo.png"
          alt="Logo BeeMate"
          class="logo"
        >
        <span>BeeMate</span>
      </div>

      <span class="pill">Video call</span>
    </header>
    <section class="stage" aria-label="Informasi panggilan masuk">

      <div class="avatar-wrap">
        <span class="ring" aria-hidden="true"></span>
        <span class="ring r2" aria-hidden="true"></span>

        <div class="av" aria-label="Inisial Feli">
          FL
        </div>
      </div>

      <h1 class="contact-name">Feli</h1>

      <p
        class="m call-status"
        id="st"
        role="status"
        aria-live="polite"
      >
        Panggilan video masuk
      </p>

      <span class="pill verified">
        ✓ Terverifikasi BINUS
      </span>

    </section>

    <footer class="ctl">

      <div class="cb">
        <a
          class="end"
          href="8-chat.html"
          aria-label="Tolak panggilan"
          title="Tolak panggilan"
        >
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 14c5-5 13-5 18 0l-2 3.5-3.5-1.2v-2.6c-2-.8-4-.8-6 0v2.6L5 17.5z"/>
          </svg>
        </a>

        <span>Tolak</span>
      </div>
      <div class="cb">
        <a
          class="ok"
          href="10-video-call.html?connected=1"
          aria-label="Terima panggilan video"
          title="Terima panggilan video"
        >
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="6" width="13" height="12" rx="2.5"/>
            <path d="M15 10.5l6-3.5v10l-6-3.5"/>
          </svg>
        </a>

        <span>Terima</span>
      </div>

    </footer>

  </main>
</body>
</html>
